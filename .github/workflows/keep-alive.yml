name: Keep Render API Awake

# Render's free plan suspends idle web services, which also pauses the election lifecycle scheduler.
# This optional workflow pings the readiness probe every 10 minutes while an election is running.
# It only runs when the repository variable RENDER_KEEPALIVE_URL is set, for example to
# https://votetrust-api.onrender.com/actuator/health/readiness. Delete the variable to stop it.
# A single always-on free instance fits within Render's monthly free hours.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping readiness probe
    if: ${{ vars.RENDER_KEEPALIVE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 20 "$KEEPALIVE_URL"
        env:
          KEEPALIVE_URL: ${{ vars.RENDER_KEEPALIVE_URL }}
