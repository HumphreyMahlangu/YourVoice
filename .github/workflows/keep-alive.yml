name: Keep Render API Awake

# Historical Render utility. Heroku is the active deployment target.
# Scheduling is disabled; this is retained for explicit legacy maintenance only.
on:
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping readiness probe
    if: ${{ vars.RENDER_KEEPALIVE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 20 "$KEEPALIVE_URL"
        env:
          KEEPALIVE_URL: ${{ vars.RENDER_KEEPALIVE_URL }}
