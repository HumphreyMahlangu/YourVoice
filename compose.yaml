services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-votetrust}
      POSTGRES_USER: ${POSTGRES_USER:-votetrust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - votetrust-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    image: votetrust-api:local
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-votetrust}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-votetrust}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      VOTETRUST_JWT_SECRET: ${VOTETRUST_JWT_SECRET:?VOTETRUST_JWT_SECRET is required}
      VOTETRUST_JWT_ISSUER: ${VOTETRUST_JWT_ISSUER:-votetrust-api}
      VOTETRUST_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: ${VOTETRUST_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-15}
      VOTETRUST_JWT_REFRESH_TOKEN_EXPIRATION_HOURS: ${VOTETRUST_JWT_REFRESH_TOKEN_EXPIRATION_HOURS:-12}
      VOTETRUST_LOGIN_MAX_FAILURES: ${VOTETRUST_LOGIN_MAX_FAILURES:-5}
      VOTETRUST_LOGIN_LOCK_SECONDS: ${VOTETRUST_LOGIN_LOCK_SECONDS:-900}
      VOTETRUST_CORS_ALLOWED_ORIGINS: ${VOTETRUST_CORS_ALLOWED_ORIGINS:-}
      VOTETRUST_ID_HASH_PEPPER: ${VOTETRUST_ID_HASH_PEPPER:?VOTETRUST_ID_HASH_PEPPER is required}
      VOTETRUST_VOTE_CREDENTIAL_PEPPER: ${VOTETRUST_VOTE_CREDENTIAL_PEPPER:?VOTETRUST_VOTE_CREDENTIAL_PEPPER is required}
      VOTETRUST_RATE_LIMIT_ENABLED: ${VOTETRUST_RATE_LIMIT_ENABLED:-true}
      VOTETRUST_RATE_LIMIT_WINDOW_SECONDS: ${VOTETRUST_RATE_LIMIT_WINDOW_SECONDS:-60}
      VOTETRUST_RATE_LIMIT_AUTH_LIMIT: ${VOTETRUST_RATE_LIMIT_AUTH_LIMIT:-100}
      VOTETRUST_RATE_LIMIT_BOOTSTRAP_LIMIT: ${VOTETRUST_RATE_LIMIT_BOOTSTRAP_LIMIT:-20}
      VOTETRUST_RATE_LIMIT_CREDENTIAL_LIMIT: ${VOTETRUST_RATE_LIMIT_CREDENTIAL_LIMIT:-100}
      VOTETRUST_RATE_LIMIT_BALLOT_LIMIT: ${VOTETRUST_RATE_LIMIT_BALLOT_LIMIT:-100}
      VOTETRUST_ADMIN_BOOTSTRAP_ENABLED: ${VOTETRUST_ADMIN_BOOTSTRAP_ENABLED:-false}
      VOTETRUST_ADMIN_BOOTSTRAP_TOKEN: ${VOTETRUST_ADMIN_BOOTSTRAP_TOKEN:-}
      JAVA_OPTS: ${JAVA_OPTS:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

volumes:
  votetrust-postgres-data:
