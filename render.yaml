services:
  - type: web
    name: votetrust-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: votetrust-db
          property: host
      - key: SPRING_DATASOURCE_PORT
        fromDatabase:
          name: votetrust-db
          property: port
      - key: SPRING_DATASOURCE_NAME
        fromDatabase:
          name: votetrust-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: votetrust-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: votetrust-db
          property: password
      - key: VOTETRUST_JWT_SECRET
        generateValue: true
      - key: VOTETRUST_ID_HASH_PEPPER
        generateValue: true
      - key: VOTETRUST_VOTE_CREDENTIAL_PEPPER
        generateValue: true
      - key: VOTETRUST_CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: VOTETRUST_ADMIN_BOOTSTRAP_ENABLED
        value: "false"

databases:
  - name: votetrust-db
    plan: free
    databaseName: votetrust
    user: votetrust