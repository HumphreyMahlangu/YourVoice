services:
  - type: web
    name: votetrust-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SERVER_PORT
        value: ${{PORT}}
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${{votetrust-db.host}}:${{votetrust-db.port}}/${{votetrust-db.database}}
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: votetrust-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: votetrust-db
          property: password
      - key: VOTETRUST_JWT_SECRET
        generateValue: true
      - key: VOTETRUST_ID_HASH_PEPPER
        generateValue: true
      - key: VOTETRUST_VOTE_CREDENTIAL_PEPPER
        generateValue: true
      - key: VOTETRUST_CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: VOTETRUST_ADMIN_BOOTSTRAP_ENABLED
        value: "false"

databases:
  - name: votetrust-db
    plan: free
    databaseName: votetrust
    user: votetrust