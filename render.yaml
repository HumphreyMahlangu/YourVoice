# The service and database keep their original "votetrust" names on purpose: renaming them would make Render
# create a new service (new URL) and a new, empty database.
services:
  - type: web
    name: votetrust-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    # Deploy a new commit only after its GitHub checks (the CI workflow) have passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: votetrust-db
          property: host
      - key: SPRING_DATASOURCE_PORT
        fromDatabase:
          name: votetrust-db
          property: port
      - key: SPRING_DATASOURCE_NAME
        fromDatabase:
          name: votetrust-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: votetrust-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: votetrust-db
          property: password
      # Secrets are set in the Render dashboard (sync: false) so a Blueprint sync never generates or replaces
      # them. Each must be at least 32 random characters, e.g. `openssl rand -base64 48`. Never change the two
      # peppers once voters exist: stored ID hashes, spent ballot tokens and ballot keys depend on them.
      - key: YOURVOICE_JWT_SECRET
        sync: false
      - key: YOURVOICE_ID_HASH_PEPPER
        sync: false
      - key: YOURVOICE_VOTE_CREDENTIAL_PEPPER
        sync: false
      # Comma-separated browser origins allowed to call the API, e.g. the Vercel frontend:
      # https://<project>.vercel.app,http://localhost:5173
      - key: YOURVOICE_CORS_ALLOWED_ORIGINS
        sync: false
      - key: YOURVOICE_ADMIN_BOOTSTRAP_ENABLED
        value: false

databases:
  - name: votetrust-db
    plan: free
    databaseName: votetrust
    user: votetrust