spring.application.name=votetrust-api

server.port=${SERVER_PORT:${PORT:8080}}
server.shutdown=graceful
# Behind Render's proxy, resolve the client IP from X-Forwarded-For (only trusted from private-network proxies)
# so rate limiting and security audit events see real client addresses instead of the proxy's.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_NAME:votetrust}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=VoteTrust API
info.app.description=Secure REST API for a South African online voting simulation

votetrust.security.cors.allowed-origins=${VOTETRUST_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
votetrust.security.jwt.secret=${VOTETRUST_JWT_SECRET}
votetrust.security.jwt.issuer=${VOTETRUST_JWT_ISSUER:votetrust-api}
votetrust.security.jwt.access-token-expiration-minutes=${VOTETRUST_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
votetrust.security.identity-hash-pepper=${VOTETRUST_ID_HASH_PEPPER}
votetrust.security.vote-credential-pepper=${VOTETRUST_VOTE_CREDENTIAL_PEPPER}
votetrust.security.rate-limit.enabled=${VOTETRUST_RATE_LIMIT_ENABLED:true}
votetrust.security.rate-limit.window-seconds=${VOTETRUST_RATE_LIMIT_WINDOW_SECONDS:60}
votetrust.security.rate-limit.auth-limit=${VOTETRUST_RATE_LIMIT_AUTH_LIMIT:100}
votetrust.security.rate-limit.bootstrap-limit=${VOTETRUST_RATE_LIMIT_BOOTSTRAP_LIMIT:20}
votetrust.security.rate-limit.credential-limit=${VOTETRUST_RATE_LIMIT_CREDENTIAL_LIMIT:100}
votetrust.security.rate-limit.ballot-limit=${VOTETRUST_RATE_LIMIT_BALLOT_LIMIT:100}
votetrust.admin.bootstrap.enabled=${VOTETRUST_ADMIN_BOOTSTRAP_ENABLED:false}
votetrust.admin.bootstrap.token=${VOTETRUST_ADMIN_BOOTSTRAP_TOKEN:}
votetrust.lifecycle.scheduling-enabled=${VOTETRUST_LIFECYCLE_SCHEDULING_ENABLED:true}
votetrust.lifecycle.poll-interval-ms=${VOTETRUST_LIFECYCLE_POLL_INTERVAL_MS:5000}
