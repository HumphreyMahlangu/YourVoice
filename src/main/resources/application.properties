spring.application.name=yourvoice-api

server.port=${SERVER_PORT:${PORT:8080}}
server.shutdown=graceful
# Behind Render's proxy, resolve the client IP from X-Forwarded-For (only trusted from private-network proxies)
# so rate limiting and security audit events see real client addresses instead of the proxy's.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_NAME:yourvoice}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=YourVoice API
info.app.description=Secure REST API for a South African online voting simulation
management.metrics.tags.application=${spring.application.name}

# Logs carry the request ID from RequestIdFilter. Set YOURVOICE_LOG_FORMAT=json for one JSON object per line.
yourvoice.logging.format=${YOURVOICE_LOG_FORMAT:text}
logging.pattern.level=%5p [%X{requestId:-}]

yourvoice.security.cors.allowed-origins=${YOURVOICE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
yourvoice.security.jwt.secret=${YOURVOICE_JWT_SECRET}
yourvoice.security.jwt.issuer=${YOURVOICE_JWT_ISSUER:yourvoice-api}
yourvoice.security.jwt.access-token-expiration-minutes=${YOURVOICE_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
yourvoice.security.jwt.refresh-token-expiration-hours=${YOURVOICE_JWT_REFRESH_TOKEN_EXPIRATION_HOURS:12}
yourvoice.security.login-throttle.max-failures=${YOURVOICE_LOGIN_MAX_FAILURES:5}
yourvoice.security.login-throttle.lock-seconds=${YOURVOICE_LOGIN_LOCK_SECONDS:900}
yourvoice.security.identity-hash-pepper=${YOURVOICE_ID_HASH_PEPPER}
yourvoice.security.vote-credential-pepper=${YOURVOICE_VOTE_CREDENTIAL_PEPPER}
yourvoice.security.rate-limit.enabled=${YOURVOICE_RATE_LIMIT_ENABLED:true}
yourvoice.security.rate-limit.window-seconds=${YOURVOICE_RATE_LIMIT_WINDOW_SECONDS:60}
yourvoice.security.rate-limit.auth-limit=${YOURVOICE_RATE_LIMIT_AUTH_LIMIT:100}
yourvoice.security.rate-limit.bootstrap-limit=${YOURVOICE_RATE_LIMIT_BOOTSTRAP_LIMIT:20}
yourvoice.security.rate-limit.credential-limit=${YOURVOICE_RATE_LIMIT_CREDENTIAL_LIMIT:100}
yourvoice.security.rate-limit.ballot-limit=${YOURVOICE_RATE_LIMIT_BALLOT_LIMIT:100}
yourvoice.admin.bootstrap.enabled=${YOURVOICE_ADMIN_BOOTSTRAP_ENABLED:false}
yourvoice.admin.bootstrap.token=${YOURVOICE_ADMIN_BOOTSTRAP_TOKEN:}
yourvoice.lifecycle.scheduling-enabled=${YOURVOICE_LIFECYCLE_SCHEDULING_ENABLED:true}
yourvoice.lifecycle.poll-interval-ms=${YOURVOICE_LIFECYCLE_POLL_INTERVAL_MS:5000}

# Framework body/validation tracing can contain rejected inputs even when request headers are masked.
# Keep sensitive payload diagnostics disabled; use request IDs and domain outcomes instead.
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=INFO
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
