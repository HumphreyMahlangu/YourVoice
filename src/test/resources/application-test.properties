spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

yourvoice.security.jwt.secret=test-secret-value-for-yourvoice-auth-tests-32-chars-minimum
yourvoice.security.jwt.issuer=yourvoice-api-test
yourvoice.security.jwt.access-token-expiration-minutes=15
yourvoice.security.identity-hash-pepper=test-identity-hash-pepper-for-registration-tests-32-chars-minimum
yourvoice.security.vote-credential-pepper=test-vote-credential-pepper-for-voting-tests-32-chars-minimum
yourvoice.lifecycle.scheduling-enabled=false

# Each cached Spring test context owns a connection pool. Keep idle connections low so many contexts fit within
# PostgreSQL's default max_connections (100), locally and in CI. Pools still grow on demand for concurrency tests.
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=10000
